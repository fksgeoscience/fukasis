name: PC tools release

# web/ と cli/ のリリース。手順は docs/releasing.md を参照。
#   - `pc-v<バージョン>` のタグを push すると, 実行ファイルと web 版の zip を付けた
#     GitHub Release の「下書き」を作る (アプリのリリースは `v*` タグなので別系統)。
#   - crates.io / npm への公開は, リポジトリ変数で有効にしたときだけ行う。
#   - 手動実行 (workflow_dispatch) は予行演習で, Release も公開もしない。
on:
  push:
    tags:
      - "pc-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pc-v') }}

jobs:
  check:
    name: Check versions & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # タグ, cli/Cargo.toml, web/package.json のバージョンがそろっていることを確かめる
      - name: Versions
        id: version
        shell: bash
        run: |
          cli=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)
          web=$(node -p "require('./web/package.json').version")
          echo "cli=$cli web=$web ref=$GITHUB_REF"
          if [ "$cli" != "$web" ]; then
            echo "::error::cli/Cargo.toml ($cli) と web/package.json ($web) のバージョンが違います"
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$GITHUB_REF_NAME" != "pc-v$cli" ]; then
            echo "::error::タグ $GITHUB_REF_NAME がバージョン $cli と合っていません (pc-v$cli のはず)"
            exit 1
          fi
          echo "version=$cli" >> "$GITHUB_OUTPUT"
      - name: Test (web)
        run: node --test web/test/core.test.js web/test/server.test.js
      - name: Test (cli)
        working-directory: cli
        run: cargo test --locked
      - name: Package (cli)
        working-directory: cli
        run: cargo package --locked

  release:
    name: Draft GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # 下書きで作るので, 内容を確かめてから手で公開する.
      # アプリのリリースが「Latest」のままになるよう --latest=false にする
      - name: Create draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --latest=false --verify-tag
          --title "FUKASIS for PC ${{ needs.check.outputs.version }}"
          --notes "PC 用ツール (web 版 / コマンドライン版) のリリースです。使い方は web/README.md と cli/README.md を参照してください。"
      - name: Pack web
        shell: bash
        run: |
          name="fukasis-web-${{ needs.check.outputs.version }}"
          mkdir "$name"
          cp -R web/index.html web/css web/js web/README.md LICENSE "$name/"
          zip -r "$name.zip" "$name"
      - name: Upload web (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: fukasis-web-${{ needs.check.outputs.version }}
          path: fukasis-web-*.zip
          if-no-files-found: error
      - name: Upload web (release)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" fukasis-web-*.zip

  binaries:
    name: Binary (${{ matrix.os }})
    needs: [check, release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        working-directory: cli
        run: cargo build --release --locked
      # fukasis-<バージョン>-<ターゲット>.zip にまとめる
      - name: Pack
        id: pack
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          name="fukasis-${{ needs.check.outputs.version }}-$target"
          mkdir "$name"
          cp cli/README.md LICENSE "$name/"
          if [ -f cli/target/release/fukasis.exe ]; then
            cp cli/target/release/fukasis.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp cli/target/release/fukasis "$name/"
            zip -r "$name.zip" "$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload binary (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.zip
          if-no-files-found: error
      - name: Upload binary (release)
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.name }}.zip"

  # crates.io への公開. リポジトリ変数 PUBLISH_CRATES_IO を true にし,
  # シークレット CARGO_REGISTRY_TOKEN を登録したときだけ動く
  publish-crate:
    name: Publish to crates.io
    needs: [check, binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pc-v') && vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # npm への公開. リポジトリ変数 PUBLISH_NPM を true にし,
  # シークレット NPM_TOKEN を登録したときだけ動く
  publish-npm:
    name: Publish to npm
    needs: [check, binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pc-v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        working-directory: web
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # トークンは環境変数から読ませる (ファイルには書かない)
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          npm publish --access public
